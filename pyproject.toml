[project]
name = "reports-suite"
version = "1.0.0"
description = "Reportería ejecutiva automatizada: GESPRO/Redmine, GitLab y tendencias tecnológicas"
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
reports = "cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
