[project]
name = "reports-suite"
version = "1.0.0"
description = "Reportería ejecutiva automatizada: GESPRO/Redmine, GitLab y tendencias tecnológicas"
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "matplotlib>=3.8",   # gráficos del informe GitLab (aprobado por el usuario)
    "python-gitlab>=4.0", # servidor MCP de analítica (mcp/gitlab-mcp)
    "pandas>=2.0",
    "python-dateutil>=2.8",
    "fastmcp>=2.0.0",    # servidor MCP (mcp/gitlab-mcp)
]

[project.scripts]
reports = "cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
